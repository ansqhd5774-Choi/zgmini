# Adapted from github.com/actions/starter-workflows/code-scanning/codeql.yml
# Separate workflow: code scanning needs security-events:write; build CI does not.
name: CodeQL JavaScript TypeScript

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'worker/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/codeql-source.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'worker/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/codeql-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Do not grant a write-enabled scanner to untrusted fork code.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:javascript-typescript
