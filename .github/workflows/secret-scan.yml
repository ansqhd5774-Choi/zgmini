# Adapted from https://github.com/gitleaks/gitleaks-action (v3).
# Scan repository changes; never publish potentially sensitive matches.
name: Source Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: site-secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # PR merge refs can select an unrelated branch range; inspect the actual head.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # Resolve the exact two-dot range and reject unavailable ancestors.
      # Include commits introduced through all merge parents.
      - name: Validate Git history range
        id: range
        env:
          ZGMINI_SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-secret-scan-range.mjs
      # Official Gitleaks 8.24.3 image pinned by immutable GHCR manifest digest.
      # Findings are redacted; no SARIF/comment/artifact contains secret bytes.
      - name: Scan changes for credentials
        # Git in the pinned container runs as a different UID from checkout.
        # Restrict the explicit safe.directory exception to this container step.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
        with:
          args: git --redact --exit-code=1 --log-opts=${{ steps.range.outputs.log_opts }} .
