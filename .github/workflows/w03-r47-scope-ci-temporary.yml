name: W03 R47 scoped CI temporary
on:
  push:
    branches: [codex/theme-fear-greed-integration-20261025]
    paths:
      - '.github/workflows/w03-r47-scope-ci-temporary.yml'
      - 'tests/theme-nine-r24-session-audit.test.mjs'
      - 'tests/theme-nine-r25-individual-score.test.mjs'
      - 'tests/theme-nine-r32-private-aggregate.test.mjs'
      - 'tests/theme-nine-r32-readonly-preflight.test.mjs'
      - 'tests/theme-nine-r35-delta-collect.test.mjs'
      - 'tests/theme-nine-r47-embedded-calendar-validation.test.mjs'
      - 'tests/theme-nine-r47-private-score.test.mjs'
      - 'tests/theme-nine-r47-recurring-bundle.test.mjs'
      - 'tests/theme-nine-r47-recurring-private-refresh.test.mjs'
      - 'tests/theme-nine-r49-one-click-installer.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w03-r47-scope-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  r47-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: W03 R24 R25 R32 R35 R47 R49 scoped regression
        run: |
          node --test --test-concurrency=2 \
            tests/theme-nine-r24-session-audit.test.mjs \
            tests/theme-nine-r25-individual-score.test.mjs \
            tests/theme-nine-r32-private-aggregate.test.mjs \
            tests/theme-nine-r32-readonly-preflight.test.mjs \
            tests/theme-nine-r35-delta-collect.test.mjs \
            tests/theme-nine-r47-embedded-calendar-validation.test.mjs \
            tests/theme-nine-r47-private-score.test.mjs \
            tests/theme-nine-r47-recurring-bundle.test.mjs \
            tests/theme-nine-r47-recurring-private-refresh.test.mjs \
            tests/theme-nine-r49-one-click-installer.test.mjs
