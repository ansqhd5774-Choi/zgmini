name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Save public CSS for asset comparison
        uses: actions/upload-artifact@v4
        with:
          name: production-css-assets
          path: dist/client/assets/*.css
          retention-days: 7
          if-no-files-found: error
      - name: Save public JavaScript for chunk verification
        uses: actions/upload-artifact@v4
        with:
          name: production-js-assets
          path: dist/client/assets/*.js
          retention-days: 7
          if-no-files-found: error
      - name: Type check
        run: npm run typecheck
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: PC publication recovery tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test scripts/pc-writer/publication-guard.test.mjs scripts/pc-writer/korea-publication.test.mjs scripts/pc-writer/local-db.test.mjs
      - name: Cloudflare candidate read contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test scripts/projection-runtime-r52.test.mjs tests/market-projection-queue.test.mjs tests/market-public-projection-store.test.mjs scripts/candidate-guard.test.mjs scripts/candidate-2db-r5.test.mjs tests/projection-selective-source-r53.test.mjs tests/projection-writer-hotpath-r54.test.mjs tests/projection-checkpoint-r55.test.mjs tests/liquidity-percentile-r56.test.mjs scripts/candidate-shell-r7.test.mjs tests/candidate-writer-r1.test.mjs
