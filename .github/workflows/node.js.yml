name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          # Changed-file ESLint needs the real PR base and pre-push commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Build
        run: npm run build
      # Reuse the existing Vite output; no second build or external sizing service.
      - name: Measure client JS/CSS bundle sizes
        run: node scripts/ci-bundle-size.mjs
      - name: Upload bundle size report
        uses: actions/upload-artifact@v4
        with:
          name: client-bundle-size-report
          path: artifacts/ci-bundle-size/report.json
          retention-days: 7
          if-no-files-found: error
      - name: Save public CSS for asset comparison
        uses: actions/upload-artifact@v4
        with:
          name: production-css-assets
          path: dist/client/assets/*.css
          retention-days: 7
          if-no-files-found: error
      - name: Save public JavaScript for chunk verification
        uses: actions/upload-artifact@v4
        with:
          name: production-js-assets
          path: dist/client/assets/*.js
          retention-days: 7
          if-no-files-found: error
      - name: Type check
        run: npm run typecheck
      # #6 Architecture Testing: no public/runtime direct import of PC-only operations.
      # Reuses TypeScript from npm ci, no added dependencies or global baseline.
      - name: Validate public-to-PC architecture boundaries
        run: node scripts/ci-architecture-boundary.mjs
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: PC publication recovery tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test scripts/pc-writer/publication-guard.test.mjs scripts/pc-writer/korea-publication.test.mjs scripts/pc-writer/local-db.test.mjs scripts/pc-writer/inflation-causal-candidate-census-m3.test.mjs scripts/pc-writer/EARNINGS_R4_C_READ_MODEL_PREVIEW_READONLY.test.mjs
      - name: Cloudflare candidate read contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test scripts/projection-runtime-r52.test.mjs tests/market-projection-queue.test.mjs tests/market-public-projection-store.test.mjs scripts/candidate-guard.test.mjs scripts/candidate-2db-r5.test.mjs tests/projection-selective-source-r53.test.mjs tests/projection-writer-hotpath-r54.test.mjs tests/projection-checkpoint-r55.test.mjs tests/liquidity-percentile-r56.test.mjs scripts/candidate-shell-r7.test.mjs tests/candidate-writer-r1.test.mjs
      # Full legacy audit remains available via npm run lint (625 existing findings).
      # Apply the same ESLint rules to changed source without blocking unrelated code.
      - name: Lint changed source (ESLint)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/lint-changed-ci.mjs
      # Use the existing npm lockfile and registry's public vulnerability feed.
      # Fail on high/critical findings, including existing debt; source changes stay Draft.
      # Recheck after PR #1560, #1561 and #1562 patched dependency upgrades.
      - name: Validate changed GitHub Actions YAML (actionlint)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-actionlint-changed.mjs
      # #15 Supply Chain: the official dependency-graph comparison API returned
      # HTTP 403 on this public personal repo. Read local npm lock diff instead.
      # Advisory evidence only; npm audit retains the existing high/critical gate.
      - name: Review PR npm lockfile changes (local evidence)
        if: ${{ github.event_name == 'pull_request' && !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci-supply-chain-review.mjs
      - name: Upload PR supply-chain evidence
        if: ${{ github.event_name == 'pull_request' && !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-supply-chain-review
          path: artifacts/ci-supply-chain-review/report.json
          retention-days: 7
          if-no-files-found: error
      - name: Audit production dependency vulnerabilities (high or critical)
        run: npm audit --omit=dev --audit-level=high --audit=true --fund=false
