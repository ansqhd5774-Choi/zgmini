name: IndexNow notify

on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

concurrency:
  group: indexnow-main
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Notify IndexNow after Cloudflare production deploy
        env:
          INDEXNOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/indexnow-notify.mjs
