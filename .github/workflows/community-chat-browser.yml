name: Community Chat Browser UI (Mocked API)

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/community-chat.*'
      - 'app/page.tsx'
      - 'app/about-intro-popup*'
      - 'lib/about-intro-bootstrap.mjs'
      - 'tests/about-intro-bootstrap-browser-r6.mjs'
      - 'app/layout.tsx'
      - 'app/sector-fear-greed/page.tsx'
      - 'app/theme-fear-greed/page.tsx'
      - 'app/search-intent-intro.tsx'
      - 'app/about/page.tsx'
      - 'app/guides/**'
      - 'lib/economic-detail-catalog.ts'
      - 'lib/investor-search-content.ts'
      - 'components/investor-search-guide.tsx'
      - 'app/economic-indicators/**'
      - 'app/risk-indicators/**'
      - 'app/country-fear-greed.tsx'
      - 'app/fear-greed/korea/page.tsx'
      - 'app/fear-greed/investor-intent-guide.tsx'
      - 'app/dashboard-ui.tsx'
      - 'app/market-fear-greed-chart.tsx'
      - 'app/market-fear-greed-chart-renderer.tsx'
      - 'app/market-chart-animation-context.ts'
      - 'app/korea-composite-view.tsx'
      - 'components/dashboard-summary-chart.tsx'
      - 'components/dashboard-secondary-plots.tsx'
      - 'components/korea-composite-plot.tsx'
      - 'components/deferred-dashboard-charts.tsx'
      - 'hooks/use-dashboard-chart-startup.ts'
      - 'lib/dashboard-chart-startup.mjs'
      - 'lib/market-score/market-trend-window-r1.mjs'
      - 'tests/dashboard-history-browser-r5.mjs'
      - 'app/globals.css'
      - 'public/styles/fear-greed-education-r1.css'
      - 'app/fear-greed/usa/page.tsx'
      - 'tests/fear-greed-education-browser-r4.mjs'
      - 'tests/community-chat-browser-r1.mjs'
      - 'tests/dashboard-deferred-ui-browser-r1.mjs'
      - 'components/risk-detail-side-rails.*'
      - 'tests/risk-detail-side-rails-browser-r44.mjs'
      - 'app/outbreak-events.tsx'
      - 'app/outbreak-beginner-fed-r53.tsx'
      - 'app/outbreak-beginner-iran-r54.tsx'
      - 'app/outbreak-beginner-iran-r54.css'
      - 'app/outbreak-iran-parity-r55.css'
      - 'tests/outbreak-iran-parity-r55.test.mjs'
      - 'tests/outbreak-beginner-iran-r54.test.mjs'
      - 'app/outbreak-beginner-r53.css'
      - 'tests/outbreak-beginner-approved-r53.test.mjs'
      - 'app/outbreak-scenarios-r51.css'
      - 'tests/outbreak-scenarios-browser-r51.mjs'
      - '.github/workflows/community-chat-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked repository dependencies
        run: npm ci
      - name: Install test-only Playwright without changing lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install browser for offline UI interactions
        run: npx playwright install --with-deps chromium
      - name: Start local dev UI (no remote bindings and no deployment)
        run: |
          npm run dev > /tmp/zgmini-chat-vite.log 2>&1 &
          echo $! > /tmp/zgmini-chat-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:5173/ >/dev/null 2>&1; then
              echo 'Local dev UI reachable'
              exit 0
            fi
            sleep 2
          done
          tail -n 120 /tmp/zgmini-chat-vite.log
          exit 1
      - name: Validate introduction before hydration and dismissal preferences
        run: node tests/about-intro-bootstrap-browser-r6.mjs
      - name: Validate chat UI at 390, 768, 1440 and 1920 px with mocked backend
        run: node tests/community-chat-browser-r1.mjs
      - name: Validate eight-risk navigation and chat overlays at 390, 768, 1440, 1650 and 1920 px
        run: node tests/risk-detail-side-rails-browser-r44.mjs
      - name: Validate scenarios at 390, 768, 1440 and 1920 px with mocked stored snapshots
        run: node tests/outbreak-scenarios-browser-r51.mjs
      - name: Validate deferred dashboard modules and account settings with isolated fixtures
        run: node tests/dashboard-deferred-ui-browser-r1.mjs
      - name: Validate route-specific education styles and mobile layout
        run: node tests/fear-greed-education-browser-r4.mjs
      - name: Validate dashboard history period changes and newer snapshot refresh
        run: node tests/dashboard-history-browser-r5.mjs
      - name: Upload browser UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-chat-browser-r1
          path: |
            artifacts/community-chat-browser/
            artifacts/risk-detail-side-rails/
            artifacts/outbreak-scenarios/
            artifacts/dashboard-deferred-ui/
            artifacts/fear-greed-education/
            artifacts/dashboard-history/
            artifacts/about-intro-bootstrap/
          if-no-files-found: warn
      - name: Show local dev errors on failure
        if: failure()
        run: tail -n 120 /tmp/zgmini-chat-vite.log || true
