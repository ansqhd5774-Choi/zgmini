name: Community Chat Browser UI (Mocked API)

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/community-chat.*'
      - 'app/page.tsx'
      - 'app/about-intro-popup*'
      - 'lib/about-intro-bootstrap.mjs'
      - 'tests/about-intro-bootstrap-browser-r6.mjs'
      - 'app/layout.tsx'
      - 'app/sector-fear-greed/page.tsx'
      - 'app/theme-fear-greed/page.tsx'
      - 'app/theme-fear-greed/theme-detail-charts.tsx'
      - 'lib/theme-visible-asof-r1.mjs'
      - 'lib/theme-chart-day-r62.mjs'
      - 'tests/theme-visible-asof-browser-r1.mjs'
      - 'app/search-intent-intro.tsx'
      - 'app/about/page.tsx'
      - 'app/guides/**'
      - 'lib/economic-detail-catalog.ts'
      - 'lib/investor-search-content.ts'
      - 'components/investor-search-guide.tsx'
      - 'app/economic-indicators/**'
      - 'app/risk-indicators/**'
      - 'app/country-fear-greed.tsx'
      - 'app/fear-greed/korea/page.tsx'
      - 'app/fear-greed/investor-intent-guide.tsx'
      - 'app/dashboard-ui.tsx'
      - 'app/market-fear-greed-chart.tsx'
      - 'app/market-fear-greed-chart-renderer.tsx'
      - 'app/market-chart-animation-context.ts'
      - 'app/korea-composite-view.tsx'
      - 'components/dashboard-summary-chart.tsx'
      - 'components/dashboard-secondary-plots.tsx'
      - 'components/korea-composite-plot.tsx'
      - 'components/deferred-dashboard-charts.tsx'
      - 'hooks/use-dashboard-chart-startup.ts'
      - 'lib/dashboard-chart-startup.mjs'
      - 'lib/market-score/market-trend-window-r1.mjs'
      - 'tests/dashboard-history-browser-r5.mjs'
      - 'tests/cnn-current-session-verified-checks-browser-r12.mjs'
      - 'app/globals.css'
      - 'public/styles/fear-greed-education-r1.css'
      - 'app/fear-greed/usa/page.tsx'
      - 'tests/fear-greed-education-browser-r4.mjs'
      - 'tests/community-chat-browser-r1.mjs'
      - 'tests/dashboard-deferred-ui-browser-r1.mjs'
      - 'components/risk-detail-side-rails.*'
      - 'app/earnings-recession/**'
      - 'tests/earnings-r511-browser-r1.mjs'
      - 'tests/risk-detail-side-rails-browser-r44.mjs'
      - 'app/outbreak-events.tsx'
      - 'app/outbreak-beginner-fed-r53.tsx'
      - 'app/outbreak-beginner-iran-r54.tsx'
      - 'app/outbreak-beginner-iran-r54.css'
      - 'app/outbreak-iran-parity-r55.css'
      - 'tests/outbreak-iran-parity-r55.test.mjs'
      - 'tests/outbreak-beginner-iran-r54.test.mjs'
      - 'app/outbreak-beginner-r53.css'
      - 'tests/outbreak-beginner-approved-r53.test.mjs'
      - 'app/outbreak-scenarios-r51.css'
      - 'tests/outbreak-scenarios-browser-r51.mjs'
      - '.github/workflows/community-chat-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked repository dependencies
        run: npm ci
      - name: Install test-only Playwright without changing lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install browser for offline UI interactions
        run: npx playwright install --with-deps chromium
      - name: Verify Production first-party JavaScript assets with read-only Chromium
        run: node tests/production-assets-network-r1.mjs
      - name: One-time W06 Production viewport 390 and 1440 (read-only, test PR only)
        run: |
          node --input-type=module <<'W06_NODE'
          import assert from 'node:assert/strict';
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {chromium} from 'playwright';
          const ORIGIN='https://zgmini.kr';
          const output='artifacts/w06-production-viewport';
          mkdirSync(output,{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const results=[];
          try{
           for(const width of [390,1440]){
            const context=await browser.newContext({viewport:{width,height:900},serviceWorkers:'block',locale:'ko-KR'});
            const page=await context.newPage();
            page.setDefaultTimeout(15000);
            const issues=[];
            try{
             const nav=await page.goto(ORIGIN+'/',{waitUntil:'domcontentloaded',timeout:65000});
             assert.equal(nav?.status(),200,'Production homepage HTTP 200');
             const intro=page.locator('#zg-about-intro-dialog');
             if(await intro.isVisible().catch(()=>false)){
              await intro.getByRole('button',{name:'닫기',exact:true}).click({timeout:10000});
             }
             const panel=page.getByTestId('composite-panel');
             await panel.scrollIntoViewIfNeeded({timeout:30000});
             const card=page.locator('.zg-r55-summary-top[role="img"]');
             await card.waitFor({state:'visible',timeout:30000});
             const group=page.getByRole('group',{name:'종합 시장 점수 추이 기간'});
             const marketResponse=await context.request.get(ORIGIN+'/api/market-score');
             assert.equal(marketResponse.status(),200);
             const market=await marketResponse.json();
             assert.equal(market.overall?.status,'READY');
             const raw=Number(market.overall.score);
             const expected=(Math.max(0,Math.min(100,50+(raw-50)*3.5))).toFixed(1);
             const aria=await card.getAttribute('aria-label');
             const actualScore=(aria??'').match(/([0-9]+(?:\.[0-9]+)?)점/)?.[1];
             assert.equal(actualScore,expected,width+'px published composite score');
             const periods=[];
             for(const label of ['1D','1W','1Y']){
              const button=group.getByRole('button',{name:label,exact:true});
              await button.click({timeout:12000});
              assert.equal(await button.getAttribute('aria-pressed'),'true',label+' selected');
              const chart=page.locator('.zg-r55-summary-chart');
              await chart.scrollIntoViewIfNeeded();
              await chart.locator('.recharts-wrapper').waitFor({state:'visible',timeout:22000});
              const response=await context.request.get(ORIGIN+'/api/market-score/observations?period='+label);
              const payload=await response.json();
              const geometry=await chart.evaluate(root=>{
               const rect=root.getBoundingClientRect();
               return {viewport:innerWidth,documentScrollWidth:document.documentElement.scrollWidth,
                left:rect.left,right:rect.right,
                curveCount:root.querySelectorAll('path.recharts-area-curve').length,
                referenceDots:root.querySelectorAll('.recharts-reference-dot').length,
                tooltipText:root.querySelector('.cnn-history-tooltip')?.textContent??null};
              });
              assert.equal(payload.status,'READY',label+' public observed status');
              assert(geometry.left>=-2&&geometry.right<=width+2,width+'px '+label+' chart clipped');
              assert(geometry.documentScrollWidth<=width+2,width+'px horizontal page overflow');
              assert(geometry.curveCount>0,width+'px '+label+' chart line missing');
              const last=payload.points?.at(-1);
              periods.push({label,observedCount:payload.points?.length,last,geometry});
              if(label==='1D'){
               const dot=chart.locator('.recharts-reference-dot circle').first();
               if(await dot.count()){
                await dot.hover({force:true,timeout:5000}).catch(()=>{});
                periods.at(-1).tooltip=await chart.locator('.cnn-history-tooltip').first().textContent({timeout:2500}).catch(()=>null);
      const actualTooltip=periods.at(-1).tooltip;
      const expectedLatest=(Math.max(0,Math.min(100,50+(Number(last.score)-50)*3.5))).toFixed(1);
      const expectedLocal=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(last.observedAt));
      assert(actualTooltip?.includes(expectedLatest),width+'px latest 1D tooltip score '+expectedLatest+' vs '+actualTooltip);
      assert(actualTooltip?.includes(expectedLocal),width+'px latest 1D tooltip calculatedAt '+expectedLocal+' vs '+actualTooltip);
               }
              }
              await page.screenshot({path:output+'/'+width+'-'+label+'.png',animations:'disabled'});
             }
             results.push({width,status:'PASS',score:actualScore,marketUpdatedAt:market.updatedAt,periods});
            }catch(e){
             issues.push(String(e.stack??e).slice(0,850));
             await page.screenshot({path:output+'/'+width+'-error.png',animations:'disabled'}).catch(()=>{});
             results.push({width,status:'FAIL',issues});
            }finally{await context.close();}
           }
          }finally{await browser.close();}
          writeFileSync(output+'/evidence.json',JSON.stringify({schema:'W06_PRODUCTION_VIEWPORT_READONLY_R1',checkedAt:new Date().toISOString(),results},null,2));
          for(const r of results)console.log('W06_PRODUCTION_VIEWPORT '+JSON.stringify(r));
          assert(results.every(r=>r.status==='PASS'),'W06 Production viewport verification found failures; inspect JSON and screenshots');
          
          W06_NODE
      - name: Start local dev UI (no remote bindings and no deployment)
        run: |
          npm run dev > /tmp/zgmini-chat-vite.log 2>&1 &
          echo $! > /tmp/zgmini-chat-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:5173/ >/dev/null 2>&1; then
              echo 'Local dev UI reachable'
              exit 0
            fi
            sleep 2
          done
          tail -n 120 /tmp/zgmini-chat-vite.log
          exit 1
      - name: Validate inflation criterion, previous/current values, dates and sources at 1440/390
        run: node tests/inflation-criterion-browser-r1.mjs
      - name: Validate W05 R5-11 BLS stored observations and gap-safe charts at 390/768/1440/1920
        run: node tests/earnings-r511-browser-r1.mjs
      - name: Validate employment R6 stored 29-row presentation at 1440/390
        run: node tests/employment-r6-public-browser-r1.mjs
      - name: Validate W06 latest visible theme date in mocked Chromium at 390/1440
        run: node tests/theme-visible-asof-browser-r1.mjs
      - name: Validate introduction before hydration and dismissal preferences
        run: node tests/about-intro-bootstrap-browser-r6.mjs
      - name: Validate chat UI at 390, 768, 1440 and 1920 px with mocked backend
        run: node tests/community-chat-browser-r1.mjs
      - name: Validate eight-risk navigation without chat at 390, 768, 1440, 1650 and 1920 px
        run: node tests/risk-detail-side-rails-browser-r44.mjs
      - name: Validate scenarios at 390, 768, 1440 and 1920 px with mocked stored snapshots
        run: node tests/outbreak-scenarios-browser-r51.mjs
      - name: Validate deferred dashboard modules and account settings with isolated fixtures
        run: node tests/dashboard-deferred-ui-browser-r1.mjs
      - name: Validate route-specific education styles and mobile layout
        run: node tests/fear-greed-education-browser-r4.mjs
      - name: Validate dashboard history period changes and newer snapshot refresh
        run: node tests/dashboard-history-browser-r5.mjs
      - name: Verify CNN actual PC-check 1D curve and stale-session exclusion at 390/1440
        run: node tests/cnn-current-session-verified-checks-browser-r12.mjs
      - name: Upload browser UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-chat-browser-r1
          path: |
            artifacts/community-chat-browser/
            artifacts/risk-detail-side-rails/
            artifacts/outbreak-scenarios/
            artifacts/dashboard-deferred-ui/
            artifacts/fear-greed-education/
            artifacts/dashboard-history/
            artifacts/cnn-current-session-checks/
            artifacts/about-intro-bootstrap/
            artifacts/inflation-criterion-review/
            artifacts/earnings-r511-browser/
            artifacts/employment-r6-browser/
            artifacts/theme-visible-asof/
            artifacts/production-assets-network/
            artifacts/w06-production-viewport/
          if-no-files-found: warn
      - name: Show local dev errors on failure
        if: failure()
        run: tail -n 120 /tmp/zgmini-chat-vite.log || true
