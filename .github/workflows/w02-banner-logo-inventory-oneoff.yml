name: W02 banner logos inventory (one-time)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/w02-banner-logo-inventory-oneoff.mjs'
      - '.github/workflows/w02-banner-logo-inventory-oneoff.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Read-only public displayed ticker/logo inventory
        run: node tests/w02-banner-logo-inventory-oneoff.mjs
